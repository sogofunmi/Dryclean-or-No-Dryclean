services:
  postgres:
    image:
      postgres:15-alpine
    container_name: mlflow_db
    env_file:
      - .env
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: always
    networks:
      - app_network

  scraper:
    build: 
      context: ./fashion_crawler/
    container_name: 
      scraper
    ports:
      - "6800:6800"
    volumes:
      - ~/.aws:/root/.aws
    env_file:
      - .env
    networks:
      - app_network

  etl_pipeline:
    build:
      context: ./etl
    container_name: etl_pipeline
    volumes:
      - ~/.aws:/root/.aws
    env_file:
      - .env
    networks:
      - app_network

  mlflow_server:
    image:
      ghcr.io/mlflow/mlflow:v3.15.2-full
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ~/.aws:/root/.aws
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server 
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} 
      --artifacts-destination ${MLFLOW_ARTIFACT_ROOT} --serve-artifacts
      --host 0.0.0.0 --port 5000 --allowed-hosts "*"
    networks:
      - app_network
  
  model_training:
    build:
      context: ./model_training
    container_name: model_training
    volumes:
      - ~/.aws:/root/.aws
    env_file:
      - .env
    depends_on:
      - mlflow_server
    networks:
      - app_network
    
  # FastAPI backend to test container
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws
    depends_on:
      - mlflow_server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app_network

volumes:
  postgres-db-volume:

networks:
  app_network:
    driver: bridge