stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""

.docker_setup:
  image: docker:29.5.2
  services:
    - docker:29.5.2-dind
  before_script:
    - export ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $ECR_URI
    - docker buildx create --name "Crawler" --driver docker-container --use
    - docker buildx inspect --bootstrap

build-scraper:
  extends: .docker_setup
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - fashion_crawler/**/*
  script:
    - > 
      docker buildx build --push --cache-from=type=registry,ref=$ECR_URI/fashion/scraper:cache
      --cache-to=type=registry,ref=$ECR_URI/fashion/scraper:cache,mode=max 
      -t $ECR_URI/fashion/scraper:latest -f ./fashion_crawler/Dockerfile ./fashion_crawler

build-etl:
  extends: .docker_setup
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - etl/**/*
  script:
    - > 
      docker buildx build --push --cache-from=type=registry,ref=$ECR_URI/fashion/etl:cache
      --cache-to=type=registry,ref=$ECR_URI/fashion/etl:cache,mode=max 
      -t $ECR_URI/fashion/etl:latest -f ./etl/Dockerfile ./etl
        
build-trainer:
  extends: .docker_setup
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - model_training/**/*
  script:
    - > 
      docker buildx build --push --cache-from=type=registry,ref=$ECR_URI/fashion/trainer:cache
      --cache-to=type=registry,ref=$ECR_URI/fashion/trainer:cache,mode=max  
      -t $ECR_URI/fashion/trainer:latest -f ./model_training/Dockerfile ./model_training

build-mlflow:
  extends: .docker_setup
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - mlflow/**/*
  script:
    - > 
      docker buildx build --push --cache-from=type=registry,ref=$ECR_URI/mlflow:cache
      --cache-to=type=registry,ref=$ECR_URI/mlflow:cache,mode=max  
      -t $ECR_URI/mlflow:latest -f ./mlflow/Dockerfile ./mlflow

deploy_to_aws:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  only:
    - master
  script:
    - aws ecs update-service --cluster projects --service mlflow-service 